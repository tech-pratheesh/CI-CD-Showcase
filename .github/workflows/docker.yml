name: Build and Push Docker Image

on:
  push:
    branches:
      - sample-docker

jobs:
  build:
    if: github.ref == 'refs/heads/sample-docker'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Use Node.js 18
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Build the project
        run: echo "Building the project"

  test:
    if: github.ref == 'refs/heads/sample-docker'
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Use Node.js 18
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install dependencies and test libs
        run: |
          npm install
          npm install --save-dev jest supertest

      - name: Run tests
        run: |
          echo "Running tests"
          npm test


  docker-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Log in to Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Build Docker image
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/sample-docker .

      - name: Push Docker image
        run: docker push ${{ secrets.DOCKER_USERNAME }}/sample-docker
