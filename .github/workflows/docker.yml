name: Build and Push Docker Image

on:
  push:
    branches:
      - sample-server-ssh

jobs:
  build:
    if: github.ref == 'refs/heads/sample-server-ssh'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Use Node.js 18
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Build the project
        run: echo "Building the project"

  test:
    if: github.ref == 'refs/heads/sample-server-ssh'
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Use Node.js 18
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install dependencies and test libs
        run: |
          npm install
          npm install --save-dev jest supertest

      - name: Run tests
        run: |
          echo "Running tests"
          npm test


  deploy-on-server:
    if: github.ref == 'refs/heads/sample-server-ssh'
    runs-on: ubuntu-latest
    steps:
      - name: Install SSH client
        run: |
          sudo apt-get update
          sudo apt-get install -y openssh-client

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/key.pem
          chmod 600 ~/.ssh/key.pem
          ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts
      
      - name: Deploy via SSH
        run: |
          ssh -i ~/.ssh/key.pem ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} << 'EOF'
            echo "Connected successfully!"
            uptime
          EOF
